<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대화문 생성기</title>

<style>
body{
font-family:'Noto Sans KR',sans-serif;
background:#f4f4f4;
margin:0;
padding:40px;
}
.wrap{
max-width:900px;
margin:auto;
background:#fff;
padding:30px;
border-radius:14px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}
h1{margin-top:0;}
input,select,textarea{
width:100%;
padding:12px;
margin-top:8px;
margin-bottom:18px;
border:1px solid #ddd;
border-radius:8px;
font-size:16px;
box-sizing:border-box;
}
textarea{
height:220px;
resize:vertical;
}
button{
padding:14px 18px;
border:none;
background:#111;
color:#fff;
border-radius:8px;
cursor:pointer;
font-size:16px;
}
button:hover{opacity:.9;}
</style>
</head>

<body>
<div class="wrap">

<h1>대화문 생성기</h1>

<label>제목</label>
<input id="title">

<label>유형</label>
<select id="level">
<option value="beginner">초급</option>
<option value="intermediate">중급</option>
</select>

<label>대화문 1</label>
<textarea id="text1"></textarea>

<label>대화문 2 (초급만 사용)</label>
<textarea id="text2"></textarea>

<button onclick="generate()">워드 다운로드</button>

</div>

<script src="app.js"></script>
</body>
</html>
