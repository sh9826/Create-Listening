<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대화문 생성기</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html-docx-js/0.3.1/html-docx.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

<style>
body{
font-family:'Noto Sans KR',sans-serif;
background:#f4f4f4;
padding:40px;
margin:0;
}
.wrap{
max-width:1000px;
margin:auto;
background:#fff;
padding:30px;
border-radius:14px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}
input,textarea,select{
width:100%;
padding:12px;
margin:8px 0 18px;
border:1px solid #ddd;
border-radius:8px;
font-size:16px;
box-sizing:border-box;
}
textarea{
height:220px;
resize:vertical;
}
button{
padding:12px 18px;
border:none;
background:#111;
color:#fff;
border-radius:8px;
cursor:pointer;
margin-right:8px;
}
button:hover{opacity:.9;}
.line{margin-bottom:16px; line-height:1.8;}
.red{color:red; font-weight:bold;}
.hidden{display:none;}
</style>
</head>

<body>
<div class="wrap">

<h1>대화문 생성기</h1>

<label>제목</label>
<input id="title" placeholder="예: 초급1 - 5과 익힘책 듣기 연습 문제2">

<label>유형</label>
<select id="level" onchange="toggleFields()">
<option value="초급">초급</option>
<option value="중급">중급</option>
</select>

<div id="box1">
<label>대화문 1</label>
<textarea id="text1"></textarea>
</div>

<div id="box2">
<label>대화문 2</label>
<textarea id="text2"></textarea>
</div>

<button onclick="downloadDocx()">워드 다운로드</button>

</div>

<script>
function toggleFields(){
const level=document.getElementById('level').value;
document.getElementById('box2').style.display =
(level==='초급') ? 'block' : 'none';
}
toggleFields();

function blankify(text){
return text.replace(/\((.*?)\)/g,function(match,p1){
let len = p1.length;
return '_'.repeat(Math.max(len + 2,5));
});
}

function answerify(text){
return text.replace(/\((.*?)\)/g,'<span class=\"red\">$1</span>');
}

function lines(text,mode){
return text.split('\n').map(line=>{

if(line.trim()==='') return '<br>';

let parts = line.split('|');

let ko = parts[0].trim();
let cn = parts[1] ? parts[1].trim() : '';

let result =
(mode==='q') ? blankify(ko) : answerify(ko);

let html = '<div class=\"line\">'+result+'</div>';

if(cn){
html += '<div class=\"line\" style=\"color:#666;font-size:12pt;margin-top:-10px;\">'+cn+'</div>';
}

return html;

}).join('');
}

function makeHtml(){
const title=document.getElementById('title').value || '대화문 생성기';
const level=document.getElementById('level').value;
const t1=document.getElementById('text1').value;
const t2=document.getElementById('text2').value;

let body = `
<h2>${title}</h2>
<p>1. 대화문을 듣고 빈칸에 알맞은 말을 쓰세요.</p>
<h3>1번 문제</h3>
${lines(t1,'q')}
`;

if(level==='초급'){
body += `<br><br><h3>2번 문제</h3>${lines(t2,'q')}`;
}

body += `<div style="page-break-before:always;"></div>
<h2>1번 답지</h2>
${lines(t1,'a')}
`;

if(level==='초급'){
body += `<br><br><h2>2번 답지</h2>${lines(t2,'a')}`;
}

return `
<html>
<head>
<meta charset="UTF-8">
<style>
body{font-family:'Noto Sans KR',sans-serif; padding:30px; font-size:14pt;}
.line{margin-bottom:16px; line-height:1.8;}
.red{color:red; font-weight:bold;}
</style>
</head>
<body>${body}</body></html>
`;
}

function downloadDocx(){
const content = makeHtml();
const blob = new Blob(
['\ufeff', content],
{ type: 'application/msword' }
);

const link = document.createElement('a');
link.href = URL.createObjectURL(blob);

const filename =
(document.getElementById('title').value || '대화문 생성기') + '.doc';

link.download = filename;
document.body.appendChild(link);
link.click();
document.body.removeChild(link);
}
</script>

</body>
</html>
